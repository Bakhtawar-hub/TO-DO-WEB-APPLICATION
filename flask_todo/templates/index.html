{% extends 'base.html' %}
{% block content %}
<a href="{{ url_for('add') }}" class="btn">+ Add New Task</a>
<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Description</th>
        <th>Action</th>
    </tr>
    {% for todo in todos %}
    <tr>
        <td>{{ todo.id }}</td>
        <td>{{ todo.title }}</td>
        <td>{{ todo.description }}</td>
        <td>
            <a href="{{ url_for('edit', id=todo.id) }}" class="btn-edit">Edit</a>
            <a href="{{ url_for('delete', id=todo.id) }}" class="btn-delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
