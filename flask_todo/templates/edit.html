{% extends 'base.html' %}
{% block content %}
<h2>Edit Task</h2>
<form method="POST">
    <label>Title:</label>
    <input type="text" name="title" value="{{ todo.title }}" required><br>
    <label>Description:</label>
    <textarea name="description" required>{{ todo.description }}</textarea><br>
    <button type="submit" class="btn">Update</button>
</form>
{% endblock %}
