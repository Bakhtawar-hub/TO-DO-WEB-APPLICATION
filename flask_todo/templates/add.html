{% extends 'base.html' %}
{% block content %}
<h2>Add New Task</h2>
<form method="POST">
    <label>Title:</label>
    <input type="text" name="title" required><br>

    <textarea name="description" required></textarea><br>
    <button type="submit" class="btn">Add</button>
</form>
{% endblock %}
